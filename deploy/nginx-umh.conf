# Urban Mobility Hub — reverse proxy (Nginx 1.24, Ubuntu 24.04)
# El build de producción escucha en 0.0.0.0:8080; Nginx publica 80/443.
# Los certificados y el bloque TLS los gestiona Certbot (Let's Encrypt).
server {
    server_name urbanmobility.duckdns.org 57.156.68.204;
    server_tokens off;

    client_max_body_size 10m;

    # Pagina para configurar el Wi-Fi de la camara por Bluetooth (Web Bluetooth exige HTTPS)
    location = /provision.html {
        alias /opt/umh-vision/public/provision.html;
        default_type text/html;
    }

    # WebSocket de la camara (canal en tiempo real de la ESP32-CAM): necesita Upgrade y conexion larga
    location = /api/camera/ws {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Camara de casco (ESP32-CAM): servicio umh-vision en 127.0.0.1:8090 (ver vision-service/README.md)
    location /api/camera/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 512k;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # SSE (/api/stream) necesita que Nginx no acumule la respuesta
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/urbanmobility.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/urbanmobility.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    listen [::]:80;
    server_name urbanmobility.duckdns.org 57.156.68.204;
    server_tokens off;

    # Cualquier entrada por HTTP (dominio o IP) va a la URL canónica HTTPS.
    return 301 https://urbanmobility.duckdns.org$request_uri;
}
