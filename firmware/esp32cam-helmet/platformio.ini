; Firmware ESP32-CAM (AI-Thinker) para NODO / Urban Mobility Hub.
; Solo captura y envía JPEG a POST /api/camera/frame; el backend detecta el casco.
[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800

; CPU a 240 MHz y PSRAM (necesaria para 2 buffers de JPEG). -O2: más rápido que el -Os por defecto.
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
build_unflags = -Os
build_flags =
    -O2
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=0
