cing" textLength="189.9627" x="1396.2318" y="367.3154">Entregar el veh&#237;culo</text><text fill="#1B2A41" font-family="Segoe UI" font-size="20.3125" lengthAdjust="spacing" textLength="84.9469" x="1448.7396" y="394.9811">al cliente</text></g><!--entity UC17--><g class="entity" data-entity="UC17" data-source-line="12" data-uid="ent0008" id="entity_UC17"><ellipse cx="1002.4559" cy="298.494" fill="#FDF0E4" rx="117.034" ry="41.2505" style="stroke:#1B2A41;stroke-width:0.7813;"/><text fill="#1B2A41" font-family="Segoe UI" font-size="20.3125" lengthAdjust="spacing" textLength="170.0157" x="917.448" y="296.7856">Marcar la entrega</text><text fill="#1B2A41" font-family="Segoe UI" font-size="20.3125" lengthAdjust="spacing" textLength="114.847" x="945.0324" y="324.4513">como tard&#237;a</text></g><!--entity UC19--><g class="entity" data-entity="UC19" data-source-line="13" data-uid="ent0009" id="entity_UC19"><ellipse cx="526.3141" cy="298.4985" fill="#F0EBFA" rx="113.6891" ry="40.8488" style="stroke:#1B2A41;stroke-width:0.7813;"/><text fill="#1B2A41" font-family="Segoe UI" font-size="20.3125" lengthAdjust="spacing" textLength="166.7861" x="442.921" y="297.4092">Avisar del retraso</text><text fill="#1B2A41" font-family="Segoe UI" font-size="20.3125" lengthAdjust="spacing" textLength="101.0141" x="475.807" y="325.0748">por correo</text></g><!--entity C--><g class="entity" data-entity="C" data-source-line="5" data-uid="ent0002" id="entity_C"><ellipse cx="275.6874" cy="334.3841" fill="#FFFFFF" rx="12.5" ry="12.5" style="stroke:#1B2A41;stroke-width:0.7813;"/><path d="M275.6874,346.8841 L275.6874,389.0716 M255.3749,359.3841 L295.9999,359.3841 M275.6874,389.0716 L255.3749,412.5091 M275.6874,389.0716 L295.9999,412.5091" fill="none" style="stroke:#1B2A41;stroke-width:0.7813;"/><text fill="#1B2A41" font-family="Segoe UI" font-size="21.875" font-weight="bold" lengthAdjust="spacing" textLength="76.9997" x="237.1875" y="438.2372">Cliente</text></g><!--entity D--><g class="entity" data-enti