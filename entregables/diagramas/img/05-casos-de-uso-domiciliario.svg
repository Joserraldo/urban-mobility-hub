.7151" x="1183.2016" y="825.1089">&#243;valo naranja</text><text fill="#000000" font-family="Segoe UI" font-size="21.875" lengthAdjust="spacing" textLength="222.9491" x="1337.4416" y="825.1089">lo hace el domiciliario</text><text fill="#000000" font-family="Segoe UI" font-size="21.875" lengthAdjust="spacing" textLength="142.8651" x="1183.2016" y="854.9025">&#243;valo morado</text><text fill="#000000" font-family="Segoe UI" font-size="21.875" lengthAdjust="spacing" textLength="230.3866" x="1337.4416" y="854.9025">lo hace el sistema solo</text><text fill="#000000" font-family="Segoe UI" font-size="21.875" lengthAdjust="spacing" textLength="93.384" x="1183.2016" y="884.6961">&#171;extend&#187;</text><text fill="#000000" font-family="Segoe UI" font-size="21.875" lengthAdjust="spacing" textLength="260.3553" x="1337.4416" y="884.6961">ocurre solo si hay retraso</text><line style="stroke:#000000;stroke-width:1.5625;" x1="1177.5141" x2="1603.4844" y1="771.931" y2="771.931"/><line style="stroke:#000000;stroke-width:1.5625;" x1="1177.5141" x2="1603.4844" y1="801.7246" y2="801.7246"/><line style="stroke:#000000;stroke-width:1.5625;" x1="1177.5141" x2="1603.4844" y1="831.5182" y2="831.5182"/><line style="stroke:#000000;stroke-width:1.5625;" x1="1177.5141" x2="1603.4844" y1="861.3119" y2="861.3119"/><line style="stroke:#000000;stroke-width:1.5625;" x1="1177.5141" x2="1603.4844" y1="891.1055" y2="891.1055"/><line style="stroke:#000000;stroke-width:1.5625;" x1="1177.5141" x2="1177.5141" y1="771.931" y2="891.1055"/><line style="stroke:#000000;stroke-width:1.5625;" x1="1331.7541" x2="1331.7541" y1="771.931" y2="891.1055"/><line style="stroke:#000000;stroke-width:1.5625;" x1="1603.4844" x2="1603.4844" y1="771.931" y2="891.1055"/></g><!--SRC=[RP9FRnCn4CNl_XH3k9AeID0AL5Pgy-U618hWbClKwsoCl9x8zgwe21y8ePmuSkj-iJxlTjLKocdNdj_pctdsA-krQqf39YRhP6QRsYbdjecIKB3LBb5fWz79YbV99cTepb4YGT94mSVHGcghhRCSh2Z5EacWkRF69qCSQVwqTOhb_OLQq7HwA02exC2-mkcJBuuJRoNKd3qW2L9B2rt9vOH-AOAlqHo1VZS1G2Gu1LDnt7YEjl9SSf