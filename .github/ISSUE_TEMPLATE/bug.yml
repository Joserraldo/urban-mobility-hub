name: Defecto (bug)
description: Algo no funciona como dice el SRS
labels: [bug]
body:
  - type: textarea
    id: que
    attributes:
      label: ¿Qué pasó?
      description: Describe lo observado frente a lo esperado
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      placeholder: "1. Ir a...\n2. Pulsar..."
    validations:
      required: true
  - type: input
    id: req
    attributes:
      label: Requisito afectado
      placeholder: RF-xx / RNF-xx
  - type: dropdown
    id: severidad
    attributes:
      label: Severidad
      description: Alta = módulo crítico (desbloqueo, alertas, seguridad) o bloquea el uso
      options: [Alta, Media, Baja]
    validations:
      required: true
  - type: dropdown
    id: fase
    attributes:
      label: Fase donde se detectó (métrica SQA)
      options: [Requisitos, Diseño, Código, Pruebas, Producción]
  - type: textarea
    id: evidencia
    attributes:
      label: Evidencia
      description: Capturas, logs
